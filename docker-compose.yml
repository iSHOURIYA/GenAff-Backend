
services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: genaff_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: genaff
      POSTGRES_PASSWORD: genaff_pass
      POSTGRES_DB: genaff_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genaff -d genaff_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - genaff_network

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: genaff_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - genaff_network

  # ─── App (Migrate + Start) ──────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: genaff_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override for Docker internal networking
      DATABASE_URL: postgresql://genaff:genaff_pass@postgres:5432/genaff_db?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    # Run migrations then seed then start
    command: >
      sh -c "
        node node_modules/.bin/prisma migrate deploy &&
        node dist/prisma/seed.js || true &&
        node dist/index.js
      "
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - genaff_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Adminer (DB GUI, optional) ─────────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: genaff_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - genaff_network
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  genaff_network:
    driver: bridge
