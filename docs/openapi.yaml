        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: Paginated users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
        '403':
          description: Not an admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error403' }

  /admin/topup-mock:
    post:
      tags: [Admin]
      summary: "[DEV] Approve a pending top-up transaction"
      description: |
        **Development only.** Manually marks a `pending` `TopUpTransaction` as `completed`
        and credits the wallet. Simulates what the Razorpay webhook does in production.

        Use this when `method: "manual"` was passed to `POST /wallet/topup/initiate`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transaction_id]
              properties:
                transaction_id:
                  type: string
                  format: uuid
                  example: "tx-uuid-1234"
            example:
              transaction_id: "tx-uuid-1234"
      responses:
        '200':
          description: Top-up approved and wallet credited
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string, example: "completed" }
                  amount_inr_cents: { type: integer }
        '403':
          description: Not an admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error403' }
        '404':
          description: Transaction not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error404' }

  # ── Webhooks ─────────────────────────────────────────────────────────────────
  /webhooks/payments:
    post:
      tags: [Webhooks]
      summary: Razorpay payment webhook
      description: |
        Receives `payment.captured` and `order.paid` events from Razorpay and credits
        the matching `TopUpTransaction` to the user's wallet.

        ### Signature Verification
        Every webhook request from Razorpay includes an HMAC-SHA256 signature:
        ```
        x-razorpay-signature: <hex_digest>
        ```
        The digest is computed over the **raw request body** using `RAZORPAY_WEBHOOK_SECRET`.

        #### Verification (Node.js)
        ```js
        import crypto from 'crypto';

        function verify(rawBody, signature, secret) {
          const expected = crypto
            .createHmac('sha256', secret)
            .update(rawBody)
            .digest('hex');
          return crypto.timingSafeEqual(
            Buffer.from(expected, 'hex'),
            Buffer.from(signature, 'hex')
          );
        }
        ```

        ### Event: `payment.captured`
        ```json
        {
          "event": "payment.captured",
          "payload": {
            "payment": {
              "entity": {
                "id": "pay_AbcXyz123",
                "order_id": "order_AbcXyz123",
                "receipt": "<TopUpTransaction.id>",
                "amount": 10000,
                "currency": "INR",
                "status": "captured"
              }
            }
          }
        }
        ```
        The `receipt` field maps to the `TopUpTransaction.id` stored in the database.

        ### Event: `order.paid`
        Similar structure with `payload.order.entity.receipt`.

        ### Idempotency
        If the transaction is already `completed`, the webhook is acknowledged (`200 OK`) without re-crediting.

        Unhandled events are always acknowledged with `{ "received": true, "event": "<name>" }`.
      parameters:
        - name: x-razorpay-signature
          in: header
          required: true
          schema: { type: string }
          description: HMAC-SHA256(rawBody, RAZORPAY_WEBHOOK_SECRET) in hex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event: { type: string, example: "payment.captured" }
                payload: { type: object }
            example:
              event: "payment.captured"
              payload:
                payment:
                  entity:
                    id: "pay_AbcXyz123"
                    receipt: "tx-uuid-1234"
                    amount: 10000
                    currency: "INR"
                    status: "captured"
      responses:
        '200':
          description: Webhook acknowledged (always returned on valid events)
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean, example: true }
                  event: { type: string, example: "payment.captured" }
        '400':
          description: Invalid signature or malformed body
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: "Invalid signature" }
        '500':
          description: Webhook processing error (Razor retries on 5xx)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error500' }
