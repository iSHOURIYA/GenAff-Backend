  # ── Admin ────────────────────────────────────────────────────────────────────
  /admin/providers:
    get:
      tags: [Admin]
      summary: List provider configurations
      description: Returns all provider configs ordered by priority. Requires `role=admin`.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Provider configs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProviderConfig' }
        '401':
          description: Missing JWT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error401' }
        '403':
          description: Not an admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error403' }
    post:
      tags: [Admin]
      summary: Create or update a provider configuration
      description: |
        Upserts a provider's pricing/priority/enabled config.
        If the provider doesn't exist yet, creates it with the supplied values.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: { type: string, enum: [openai, deepseek, gemini] }
                enabled: { type: boolean }
                pricing_per_token_usd: { type: number, example: 0.00001 }
                base_request_cost_usd: { type: number, example: 0.0005 }
                priority: { type: integer, example: 1, description: "Lower = higher priority" }
            example:
              provider: "openai"
              enabled: true
              pricing_per_token_usd: 0.00001
              base_request_cost_usd: 0.0005
              priority: 1
      responses:
        '200':
          description: Updated provider config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderConfig' }
        '403':
          description: Not an admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error403' }

  /admin/users/{id}/credits:
    patch:
      tags: [Admin]
      summary: Adjust user credits or wallet balance
      description: |
        Adds or removes free units and/or wallet balance for a specific user.
        Use positive integers to add, negative to subtract.

        **Examples:**
        - Grant 10 free requests: `{ "free_units_delta": 10 }`
        - Add ₹100 to wallet: `{ "wallet_inr_paisa_delta": 10000 }`
        - Remove ₹5 from wallet: `{ "wallet_inr_paisa_delta": -500 }`
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Target user ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                free_units_delta:
                  type: integer
                  example: 10
                  description: Positive to add, negative to subtract
                wallet_inr_paisa_delta:
                  type: integer
                  example: 10000
                  description: Amount in paisa — positive to credit, negative to debit
            example:
              free_units_delta: 10
              wallet_inr_paisa_delta: 10000
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403':
          description: Not an admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error403' }
        '404':
          description: User not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error404' }

