openapi: 3.1.0
info:
  title: GenAff API Gateway
  version: 1.0.0
  description: |
    **GenAff** is a multi-provider AI API gateway with per-request billing in INR paisa,
    wallet top-ups via Razorpay, API-key management, and rate limiting.

    ## Authentication
    Two security schemes are in use:

    | Scheme | Header | Used by |
    |--------|--------|---------|
    | `BearerAuth` | `Authorization: Bearer <JWT>` | Dashboard, admin, key management |
    | `ApiKeyAuth` | `Authorization: Bearer <USER_API_KEY>` | Proxy endpoints (`/v1/*`) |

    ## Billing Overview
    1. New users receive **free units** (requests or tokens, configurable).
    2. Once free units are exhausted, each request deducts cost from the wallet in **INR paisa** (1 paisa = ₹0.01).
    3. Cost is estimated **before** the provider call; over/under-charges are reconciled after.
    4. If wallet balance is insufficient, a **402 Payment Required** is returned.

    ## Rate Limits
    Default limits per API key:
    - **20 requests / minute**
    - **500 requests / day**

    Rate-limit headers are returned on every proxy response:
    ```
    X-RateLimit-Minute-Remaining: 19
    X-RateLimit-Day-Remaining: 499
    ```

  contact:
    name: GenAff Support
    email: shouriyatayal1234@gmail.com
  license:
    name: MIT

servers:
  - url: https://genaff-api.shauryacodes.xyz
    description: Production
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Auth
    description: User registration, login, and profile
  - name: API Keys
    description: Create and manage API keys used by the proxy
  - name: Wallet
    description: Wallet top-up initiation and usage/billing history
  - name: Proxy
    description: OpenAI-compatible chat completions proxied to configured AI providers
  - name: Billing
    description: Usage and billing history
  - name: Admin
    description: Provider configuration and user management (role=admin only)
  - name: Webhooks
    description: Payment provider callbacks (Razorpay)

# ─── Security Schemes ──────────────────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT obtained from `POST /auth/login`.
        Payload: `{ sub: userId, email, role, iat, exp }`.
        Pass as: `Authorization: Bearer <token>`
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: |
        User-generated API key (prefixed `sk_`).
        Obtained from `POST /keys` — shown **once** at creation.
        Pass as: `Authorization: Bearer sk_<key>`

  # ─── Reusable Schemas ──────────────────────────────────────────────────────
  schemas:
    Error400:
      type: object
      properties:
        error: { type: string, example: "Invalid request body" }
        details: { type: array, items: { type: object } }
    Error401:
      type: object
      properties:
        error: { type: string, example: "Invalid or inactive API key" }
    Error402:
      type: object
      properties:
        error: { type: string, example: "Insufficient wallet balance" }
        message: { type: string, example: "Your wallet has ₹5.00 but this request costs approximately ₹0.21. Please top up your wallet." }
        required_inr_paisa: { type: integer, example: 21 }
        current_balance_inr_paisa: { type: integer, example: 500 }
    Error403:
      type: object
      properties:
        error: { type: string, example: "Admin access required" }
    Error404:
      type: object
      properties:
        error: { type: string, example: "Resource not found" }
    Error409:
      type: object
      properties:
        error: { type: string, example: "Email already registered" }
    Error429:
      type: object
      properties:
        error: { type: string, example: "Rate limit exceeded" }
        retry_after: { type: integer, example: 42, description: "Seconds until the next request is allowed" }
    Error500:
      type: object
      properties:
        error: { type: string, example: "Internal server error" }
    Error502:
      type: object
      properties:
        error: { type: string, example: "All AI providers failed. Please try again." }
    Error503:
      type: object
      properties:
        error: { type: string, example: "No AI providers are currently available" }

    User:
      type: object
      properties:
        id: { type: string, format: uuid, example: "a1b2c3d4-e5f6-7890-abcd-1234567890ab" }
        email: { type: string, format: email, example: "user@example.com" }
        role: { type: string, enum: [user, admin], example: "user" }
        free_units_remaining: { type: integer, example: 10 }
        createdAt: { type: string, format: date-time }
        wallet:
          type: object
          properties:
            balance_inr_cents: { type: integer, example: 5000, description: "Balance in paisa (5000 = ₹50.00)" }

    ApiKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "production-key" }
        plain_key_preview: { type: string, example: "abc123", description: "Last 6 chars of the key" }
        active: { type: boolean, example: true }
        createdAt: { type: string, format: date-time }

    ApiKeyCreated:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          properties:
            key:
              type: string
              example: "sk_a1b2c3d4e5f6a1b2c3d4e5f6abc123"
              description: "Full plaintext API key — shown ONLY at creation. Store securely."

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [system, user, assistant] }
        content: { type: string }

    ChatCompletionRequest:
      type: object
      required: [messages]
      properties:
        model:
          type: string
          example: "gpt-4o-mini"
          description: "Optional model override. If omitted, cheapest available model is selected."
        messages:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ChatMessage' }
        temperature:
          type: number
          minimum: 0
          maximum: 2
          example: 0.7
        max_tokens:
          type: integer
          example: 500
        preferred_provider:
          type: string
          enum: [openai, deepseek, gemini]
          description: "Hint for provider selection. Falls back to next if unavailable."

    ChatCompletionResponse:
      type: object
      properties:
        id: { type: string, example: "chatcmpl-abc123" }
        object: { type: string, example: "chat.completion" }
        created: { type: integer, example: 1709900400 }
        model: { type: string, example: "gpt-4o-mini" }
        choices:
          type: array
          items:
            type: object
            properties:
              index: { type: integer, example: 0 }
              message:
                type: object
                properties:
                  role: { type: string, example: "assistant" }
                  content: { type: string, example: "Hello! How can I help you today?" }
              finish_reason: { type: string, example: "stop" }
        usage:
          type: object
          properties:
            prompt_tokens: { type: integer, example: 15 }
            completion_tokens: { type: integer, example: 185 }
            total_tokens: { type: integer, example: 200 }

    UsageRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [openai, deepseek, gemini] }
        model: { type: string, example: "gpt-4o-mini" }
        tokens_used: { type: integer, example: 200 }
        cost_inr_cents: { type: integer, example: 21, description: "Actual cost in paisa" }
        status: { type: string, enum: [pending, reserved, completed, failed] }
        createdAt: { type: string, format: date-time }

    ProviderConfig:
      type: object
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [openai, deepseek, gemini] }
        enabled: { type: boolean, example: true }
        pricing_per_token_usd:
          type: string
          example: "0.000010000"
          description: "Cost per token in USD (Decimal as string)"
        base_request_cost_usd:
          type: string
          example: "0.0005000000"
          description: "Fixed cost per request in USD (Decimal as string)"
        priority: { type: integer, example: 1, description: "Lower = higher priority" }

    TopUpInitiateResponse:
      type: object
      properties:
        transaction_id: { type: string, format: uuid }
        razorpay_order_id: { type: string, example: "order_Abc123" }
        amount_inr_paisa: { type: integer, example: 10000 }
        currency: { type: string, example: "INR" }
        status: { type: string, example: "pending" }

# ─── Paths ─────────────────────────────────────────────────────────────────────
paths:

  # ── Auth ────────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: |
        Creates a new user account. Each new user receives a configurable number of
        **free units** (set via `FREE_UNITS_ON_REGISTER` env var, default 10).
        A wallet with ₹0 balance is also created automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: "user@example.com" }
                password: { type: string, minLength: 8, example: "securepass123" }
            example:
              email: "user@example.com"
              password: "securepass123"
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/User'
                  - type: object
                    properties:
                      message: { type: string, example: "Registration successful" }
              example:
                id: "a1b2c3d4-e5f6-7890-abcd-1234567890ab"
                email: "user@example.com"
                role: "user"
                free_units_remaining: 10
                message: "Registration successful"
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error400' }
        '409':
          description: Email already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error409' }
        '500':
          description: Internal server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error500' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive JWT
      description: |
        Authenticates user credentials and returns a signed **JWT** valid for 7 days.
        Use this token as `Authorization: Bearer <token>` on all dashboard/admin routes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
            example:
              email: "user@example.com"
              password: "securepass123"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string, description: "Signed JWT" }
                  token_type: { type: string, example: "Bearer" }
                  expires_in: { type: string, example: "7d" }
              example:
                access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJhMWIy..."
                token_type: "Bearer"
                expires_in: "7d"
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error401' }
              example:
                error: "Invalid email or password"
        '500':
          description: Internal server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error500' }

  /me:
    get:
      tags: [Auth]
      summary: Get current user profile
      description: Returns the authenticated user's profile, including wallet balance and free units remaining.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              example:
                id: "a1b2c3d4-e5f6-7890-abcd-1234567890ab"
                email: "user@example.com"
                role: "user"
                free_units_remaining: 5
                createdAt: "2026-01-15T10:00:00.000Z"
                wallet:
                  balance_inr_cents: 5000
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error401' }
        '404':
          description: User not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error404' }

  # ── API Keys ────────────────────────────────────────────────────────────────
  /keys:
    get:
      tags: [API Keys]
      summary: List API keys
      description: |
        Returns all API keys belonging to the authenticated user.
        The full key is **never** returned after creation — only `plain_key_preview` (last 6 chars).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiKey' }
              example:
                - id: "k1b2c3d4-e5f6-7890-abcd-1234567890ab"
                  name: "production-key"
                  plain_key_preview: "abc123"
                  active: true
                  createdAt: "2026-01-15T10:00:00.000Z"
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error401' }
    post:
      tags: [API Keys]
      summary: Create a new API key
      description: |
        Generates a new API key. The full plaintext key is returned **only in this response**.
        The server stores only an `argon2` hash — the plaintext cannot be recovered.
        Keys have the format `sk_<random32hexchars>`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 64, example: "production-key" }
      responses:
        '201':
          description: Key created — plaintext shown once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyCreated' }
              example:
                id: "k1b2c3d4-e5f6-7890-abcd-1234567890ab"
                name: "production-key"
                key: "sk_a1b2c3d4e5f6a1b2c3d4e5f6abc123"
                plain_key_preview: "abc123"
                active: true
                createdAt: "2026-01-15T10:00:00.000Z"
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error400' }
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error401' }

  /keys/{id}/disable:
    patch:
      tags: [API Keys]
      summary: Disable an API key
      description: |
        Sets `active = false` on the key. Any subsequent proxy requests using this key will
        receive `401 Invalid or inactive API key`. The key is not deleted and can be viewed.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Key disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKey' }
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error401' }
        '404':
          description: Key not found or not owned by user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error404' }

  /keys/{id}:
    delete:
      tags: [API Keys]
      summary: Delete an API key
      description: Permanently deletes the key. Usage records referencing this key are preserved.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Key deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Key deleted" }
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error401' }
        '404':
          description: Key not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error404' }

  # ── Wallet ──────────────────────────────────────────────────────────────────
  /wallet/topup/initiate:
    post:
      tags: [Wallet]
      summary: Initiate a wallet top-up
      description: |
        Creates a `TopUpTransaction` in `pending` status and, for `razorpay` method, creates
        a Razorpay order. The client should complete payment using the Razorpay SDK with
        `razorpay_order_id`. The wallet is credited only after the webhook confirms payment.

        ### Manual (dev) flow
        Pass `"method": "manual"` and use `POST /admin/topup-mock` with the returned
        `transaction_id` to approve immediately — no Razorpay integration needed.

        **Minimum top-up:** ₹10 (1000 paisa)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_inr_paisa]
              properties:
                amount_inr_paisa:
                  type: integer
                  minimum: 1000
                  example: 10000
                  description: "Amount in paisa. 10000 = ₹100"
                method:
                  type: string
                  enum: [razorpay, manual]
                  default: razorpay
            example:
              amount_inr_paisa: 10000
              method: "razorpay"
      responses:
        '201':
          description: Top-up initiated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopUpInitiateResponse' }
              example:
                transaction_id: "tx-uuid-1234"
                razorpay_order_id: "order_Abc123xyz"
                amount_inr_paisa: 10000
                currency: "INR"
                status: "pending"
        '400':
          description: Below minimum top-up amount
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error400' }
              example:
                error: "Minimum top-up is ₹10"
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error401' }
        '502':
          description: Razorpay order creation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: "Payment initiation failed. Try again." }

  # ── Billing Usage ────────────────────────────────────────────────────────────
  /billing/usage:
    get:
      tags: [Billing]
      summary: Get usage history
      description: |
        Returns paginated usage records for the authenticated user, optionally filtered by date range.
        Each record shows provider, model, tokens used, and cost in paisa.
      security:
        - BearerAuth: []
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date, example: "2026-01-01" }
          description: Start date (inclusive), YYYY-MM-DD
        - name: to
          in: query
          schema: { type: string, format: date, example: "2026-01-31" }
          description: End date (inclusive), YYYY-MM-DD
      responses:
        '200':
          description: Usage records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UsageRecord' }
              example:
                - id: "u1b2c3d4-e5f6-7890-abcd-1234567890ab"
                  provider: "openai"
                  model: "gpt-4o-mini"
                  tokens_used: 200
                  cost_inr_cents: 21
                  status: "completed"
                  createdAt: "2026-01-15T10:05:00.000Z"
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error401' }

  # ── Proxy ────────────────────────────────────────────────────────────────────
  /v1/chat/completions:
    post:
      tags: [Proxy]
      summary: Chat completions (proxied to AI providers)
      description: |
        OpenAI-compatible chat completions endpoint. Requests are routed to the
        best available provider (OpenAI → DeepSeek → Gemini) based on priority and availability.
        Supports provider preference via `preferred_provider`.

        ### Request lifecycle
        1. Validate API key (argon2 hash comparison)
        2. Check rate limits (20/min, 500/day per key via Redis sliding window)
        3. Check free units → deduct if available, otherwise check wallet balance
        4. If wallet balance < estimated cost → **402 Payment Required**
        5. Reserve estimated cost from wallet (atomic SQL)
        6. Call provider with fallback chain
        7. Record actual token usage, settle cost difference (refund or charge)

        ### Billing math example
        ```
        provider:       OpenAI
        pricing_per_token_usd:  $0.00001
        base_request_cost_usd:  $0.0005
        tokens:          200
        exchange_rate:   83.50 INR/USD

        cost_usd  = 0.0005 + 200 × 0.00001 = 0.0025
        cost_inr  = 0.0025 × 83.50         = 0.20875 INR
        cost_paisa = ceil(0.20875 × 100)   = 21 paisa
        ```

        ### Rate limit headers
        ```
        X-RateLimit-Minute-Remaining: 19
        X-RateLimit-Day-Remaining: 499
        ```
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatCompletionRequest' }
            example:
              model: "gpt-4o-mini"
              messages:
                - role: "user"
                  content: "Explain the water cycle in 3 sentences."
              temperature: 0.7
              max_tokens: 200
      responses:
        '200':
          description: Chat completion from provider
          headers:
            X-RateLimit-Minute-Remaining:
              schema: { type: integer }
            X-RateLimit-Day-Remaining:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatCompletionResponse' }
              example:
                id: "chatcmpl-abc123"
                object: "chat.completion"
                created: 1709900400
                model: "gpt-4o-mini"
                choices:
                  - index: 0
                    message:
                      role: "assistant"
                      content: "Water evaporates from oceans and lakes, rises as vapor, condenses into clouds, and falls as rain or snow that flows back to bodies of water."
                    finish_reason: "stop"
                usage:
                  prompt_tokens: 15
                  completion_tokens: 35
                  total_tokens: 50
        '400':
          description: Invalid request body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error400' }
        '401':
          description: Missing/invalid API key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error401' }
              examples:
                missing:
                  value: { error: "Missing API key. Use Authorization: Bearer sk_..." }
                invalid:
                  value: { error: "Invalid or inactive API key" }
        '402':
          description: Insufficient wallet balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error402' }
              example:
                error: "Insufficient wallet balance"
                message: "Your wallet has ₹5.00 but this request costs approximately ₹0.21. Please top up your wallet."
                required_inr_paisa: 21
                current_balance_inr_paisa: 500
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds until next request allowed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error429' }
              example:
                error: "Rate limit exceeded"
                retry_after: 42
        '502':
          description: All providers failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error502' }
        '503':
          description: No providers configured/enabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error503' }

  /v1/models:
    get:
      tags: [Proxy]
      summary: List available models
      description: |
        Returns all active models from the `model_mappings` table, grouped with their
        provider's pricing. No authentication required.
      responses:
        '200':
          description: List of available models
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, example: "list" }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, example: "openai/gpt-4o-mini" }
                        object: { type: string, example: "model" }
                        provider: { type: string, enum: [openai, deepseek, gemini] }
                        display_name: { type: string, example: "GPT-4o Mini" }
                        pricing_per_token_usd: { type: string, example: "0.000010000" }
              example:
                object: "list"
                data:
                  - id: "openai/gpt-4o-mini"
                    object: "model"
                    provider: "openai"
                    display_name: "GPT-4o Mini"
