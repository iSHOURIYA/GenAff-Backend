version: "3.9"

# Production override — no Adminer, no exposed DB ports
services:
  postgres:
    ports: []  # Don't expose DB to host in production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-genaff}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-genaff_db}

  redis:
    ports: []  # Don't expose Redis to host in production

  app:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  adminer:
    profiles:
      - debug  # Only start adminer with: docker-compose --profile debug up
